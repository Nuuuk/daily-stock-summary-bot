name: Daily Stock Positions Summary Bot

on:
  schedule:
    # 盘前 08:37 AM EST (夏令时 UTC 12:30 / 冬令时 UTC 13:30)
    - cron: '37 12 * * 1-5'
    # 盘中 01:37 PM EST (夏令时 UTC 17:30 / 冬令时 UTC 18:30)
    - cron: '37 17 * * 1-5'

  workflow_dispatch:
    inputs:
      session_mode:
        description: '运行模式选择 (pre_market 或 mid_day)'
        required: true
        default: 'pre_market'
        type: choice
        options:
          - pre_market
          - mid_day

jobs:
  run-summary-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库代码 (Checkout)
        uses: actions/checkout@v4

      - name: 配置 Python 环境 (Python 3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装项目依赖 (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行分析与邮件推送 (Execute Bot)
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python main.py "${{ github.event.inputs.session_mode }}"
          else
            python main.py
          fi
